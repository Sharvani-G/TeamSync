name: Deploy Firebase Functions

on:
  push:
    branches: [ main ]

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: |
          npm install -g firebase-tools

      - name: Install function deps
        run: |
          cd functions
          npm ci

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > $GOOGLE_APPLICATION_CREDENTIALS
          cd functions
          npx firebase-tools deploy --only functions --project ${{ secrets.FIREBASE_PROJECT }} --non-interactive

  # NOTE: This workflow requires two repository secrets:
  # - FIREBASE_SERVICE_ACCOUNT: JSON contents of a service account key with permissions to deploy functions
  # - FIREBASE_PROJECT: Firebase project id (e.g. my-project-id)

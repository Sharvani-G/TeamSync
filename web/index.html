<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="teamsync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>teamsync</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      const appVersion = '1.0.1';
      const bootstrapUrl = `flutter_bootstrap.js?v=${appVersion}`;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              const scriptUrl = registration.active ? registration.active.scriptURL : '';
              if (scriptUrl && !scriptUrl.includes(`v=${appVersion}`)) {
                registration.unregister();
              }
            });
          });
        });
      }

      const script = document.createElement('script');
      script.src = bootstrapUrl;
      script.async = true;
      document.head.appendChild(script);
    })();
  </script>
</head>
<body>
</body>
</html>
